name: collect-windows-outputs

on:
  workflow_dispatch:

concurrency:
  group: shell-evidence-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 运行 Windows Shell 输出采集（cmd / PowerShell 5 / PowerShell 7）
        run: pwsh -NoProfile -File scripts/collect-windows.ps1

      - name: 提交 Windows 原生证据到 main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ":(glob)demos/cmd/docker/*.out.txt" ":(glob)demos/powershell/docker/native.*.out.txt"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Windows native evidence is unchanged."
            exit 0
          }
          git commit -m "chore: update Windows shell evidence (run $env:GITHUB_RUN_ID)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传 Windows 原生证据备份
        uses: actions/upload-artifact@v4
        with:
          name: hello-shell-windows-native-evidence-${{ github.run_id }}
          path: |
            demos/cmd/docker/*.out.txt
            demos/powershell/docker/native.*.out.txt
          if-no-files-found: error
