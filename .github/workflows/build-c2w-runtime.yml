name: build-c2w-runtime

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target Architecture (riscv64 or amd64)'
        required: true
        default: 'riscv64'
        type: choice
        options:
          - riscv64
          - amd64
      chunk_size:
        description: 'Chunk size for splitting (e.g. 10M, 5M)'
        required: true
        default: '10M'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - '.github/workflows/build-c2w-runtime.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install container2wasm (c2w)
        run: |
          C2W_VERSION="v0.8.4"
          echo "Installing container2wasm ${C2W_VERSION}..."
          curl -sSL "https://github.com/ktock/container2wasm/releases/download/${C2W_VERSION}/c2w-${C2W_VERSION}-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin
          c2w --version

      - name: Build custom multi-shell base Docker image
        run: |
          TARGET_ARCH="${{ inputs.target_arch || 'riscv64' }}"
          echo "Building Docker image for platform linux/${TARGET_ARCH}..."
          docker buildx build \
            --platform="linux/${TARGET_ARCH}" \
            -f Dockerfile.base \
            -t hello-shell-base:latest \
            --load .

      - name: Convert container to WebAssembly
        run: |
          TARGET_ARCH="${{ inputs.target_arch || 'riscv64' }}"
          mkdir -p ./out
          echo "Converting container to Wasm (${TARGET_ARCH})..."
          c2w --target-arch="${TARGET_ARCH}" hello-shell-base:latest ./out/c2w-runtime.wasm
          ls -lh ./out/c2w-runtime.wasm

      - name: Split and Gzip chunks
        run: |
          CHUNK_SIZE="${{ inputs.chunk_size || '10M' }}"
          DEST_DIR="docs/public/runtime/c2w"
          mkdir -p "${DEST_DIR}"
          
          # Clean previous chunks
          rm -f ${DEST_DIR}/c2w-runtime.part_*.gz ${DEST_DIR}/manifest.json

          echo "Splitting Wasm into ${CHUNK_SIZE} chunks..."
          split -d -b "${CHUNK_SIZE}" ./out/c2w-runtime.wasm ./out/c2w-runtime.part_

          echo "Compressing each chunk with gzip -9..."
          gzip -9 ./out/c2w-runtime.part_*

          echo "Moving compressed chunks to ${DEST_DIR}..."
          mv ./out/c2w-runtime.part_*.gz "${DEST_DIR}/"

          # Generate manifest
          echo "Generating manifest.json and checksums..."
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const path = require("path");
            
            const dir = "'"${DEST_DIR}"'";
            const files = fs.readdirSync(dir).filter(f => f.startsWith("c2w-runtime.part_") && f.endsWith(".gz")).sort();
            
            const manifest = {
              version: "1.0.0",
              targetArch: "'"${{ inputs.target_arch || 'riscv64' }}"'",
              chunkSize: "'"${{ inputs.chunk_size || '10M' }}"'",
              createdAt: new Date().toISOString(),
              chunks: files.map(filename => {
                const filepath = path.join(dir, filename);
                const stat = fs.statSync(filepath);
                const buf = fs.readFileSync(filepath);
                const sha256 = crypto.createHash("sha256").update(buf).digest("hex");
                return { filename, size: stat.size, sha256 };
              })
            };
            
            fs.writeFileSync(path.join(dir, "manifest.json"), JSON.stringify(manifest, null, 2));
            console.log("Manifest generated:", manifest);
          '

      - name: Generate Runtime README
        run: |
          DEST_DIR="docs/public/runtime/c2w"
          cat << 'README_EOF' > "${DEST_DIR}/README.md"
# Container2wasm Prebuilt Multi-Shell Runtime Assets

本目录存放由 GitHub Actions 云端流水线构建并分片的 `container2wasm` 浏览器多 Shell 容器底座。

## 构建策略
- **源镜像**：`Dockerfile.base` (Alpine 3.22 + bash, zsh, fish, python3, jq 等)
- **编译工具**：`c2w` (v0.8.4)
- **切片规则**：10MB 原始切片后执行 `gzip -9` 单片压缩
- **分发协议**：在 `docs/public/_headers` 中配置 `Content-Encoding: gzip`，由浏览器网络栈并发自动解压。

## 资产清单
详情参见同目录下的 `manifest.json`。
README_EOF

      - name: Upload Artifacts for Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: c2w-runtime-chunks
          path: docs/public/runtime/c2w/

      - name: Commit and push changes
        if: github.event_name == 'push' || github.event.inputs != null
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/runtime/c2w/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(runtime): update prebuilt c2w runtime assets [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
