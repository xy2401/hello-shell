name: build-c2w-runtime

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target Architecture (riscv64 or amd64)'
        required: true
        default: 'riscv64'
        type: choice
        options:
          - riscv64
          - amd64
      chunk_size:
        description: 'Chunk size for splitting (e.g. 10M, 5M)'
        required: true
        default: '10M'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - '.github/workflows/build-c2w-runtime.yml'
      - 'scripts/package-c2w.js'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install container2wasm (c2w)
        run: |
          C2W_VERSION="v0.8.4"
          echo "Installing container2wasm ${C2W_VERSION}..."
          curl -sSL "https://github.com/ktock/container2wasm/releases/download/${C2W_VERSION}/c2w-${C2W_VERSION}-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin
          c2w --version

      - name: Build custom multi-shell base Docker image
        env:
          TARGET_ARCH: ${{ inputs.target_arch || 'riscv64' }}
        run: |
          echo "Building Docker image for platform linux/${TARGET_ARCH}..."
          docker buildx build \
            --platform="linux/${TARGET_ARCH}" \
            -f Dockerfile.base \
            -t hello-shell-base:latest \
            --load .

      - name: Convert container to WebAssembly
        env:
          TARGET_ARCH: ${{ inputs.target_arch || 'riscv64' }}
        run: |
          mkdir -p ./out
          echo "Converting container to Wasm (${TARGET_ARCH})..."
          c2w --target-arch="${TARGET_ARCH}" hello-shell-base:latest ./out/c2w-runtime.wasm
          ls -lh ./out/c2w-runtime.wasm

      - name: Split, Gzip and Generate Manifest
        env:
          TARGET_ARCH: ${{ inputs.target_arch || 'riscv64' }}
          CHUNK_SIZE: ${{ inputs.chunk_size || '10M' }}
        run: |
          node scripts/package-c2w.js \
            --input ./out/c2w-runtime.wasm \
            --dest ./docs/public/runtime/c2w \
            --arch "${TARGET_ARCH}" \
            --chunk-size "${CHUNK_SIZE}"

      - name: Upload Artifacts for Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: c2w-runtime-chunks
          path: docs/public/runtime/c2w/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/runtime/c2w/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(runtime): update prebuilt c2w runtime assets [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
