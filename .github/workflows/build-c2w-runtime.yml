name: build-c2w-runtime

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target Architecture (riscv64 or amd64)'
        required: true
        default: 'amd64'
        type: choice
        options:
          - riscv64
          - amd64
      chunk_size:
        description: 'Chunk size for splitting (e.g. 10M, 5M)'
        required: true
        default: '10M'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - '.github/workflows/build-c2w-runtime.yml'
      - 'scripts/package-c2w.js'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install container2wasm (c2w)
        run: |
          C2W_VERSION="v0.8.4"
          echo "Installing container2wasm ${C2W_VERSION}..."
          curl -sSL "https://github.com/container2wasm/container2wasm/releases/download/${C2W_VERSION}/container2wasm-${C2W_VERSION}-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/c2w /usr/local/bin/c2w-net
          c2w --version

      - name: Build, Convert and Package All Environments
        env:
          TARGET_ARCH: ${{ inputs.target_arch || 'amd64' }}
          CHUNK_SIZE: ${{ inputs.chunk_size || '10M' }}
        run: |
          for ENV_NAME in base shell python powershell; do
            echo "========================================================="
            echo "Processing environment: ${ENV_NAME}"
            echo "========================================================="
            
            echo "1. Building Docker image..."
            docker buildx build \
              --platform="linux/${TARGET_ARCH}" \
              -f Dockerfile.${ENV_NAME} \
              -t hello-shell-${ENV_NAME}:latest \
              --load .
            
            echo "2. Converting container to WebAssembly..."
            mkdir -p ./out/${ENV_NAME}
            c2w \
              --build-arg SOURCE_REPO=https://github.com/container2wasm/container2wasm.git \
              --build-arg SOURCE_REPO_VERSION=v0.8.4 \
              --target-arch="${TARGET_ARCH}" \
              hello-shell-${ENV_NAME}:latest ./out/${ENV_NAME}/c2w-runtime.wasm
            ls -lh ./out/${ENV_NAME}/c2w-runtime.wasm
            
            echo "3. Splitting and generating manifest..."
            DEST_DIR="./docs/public/runtime/c2w"
            if [ "${ENV_NAME}" != "base" ]; then
              DEST_DIR="./docs/public/runtime/c2w-${ENV_NAME}"
            fi
            
            node scripts/package-c2w.js \
              --input ./out/${ENV_NAME}/c2w-runtime.wasm \
              --dest "${DEST_DIR}" \
              --arch "${TARGET_ARCH}" \
              --chunk-size "${CHUNK_SIZE}"
          done

      - name: Upload Artifacts for Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: c2w-runtime-chunks
          path: docs/public/runtime/c2w*/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/runtime/c2w*/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(runtime): update prebuilt c2w runtime assets for all environments [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
