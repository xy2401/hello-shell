name: collect-docker-outputs

on:
  workflow_dispatch:

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行 Linux Shell 容器化输出采集
        run: npm run collect-outputs

      - name: 验证项目与 VitePress 生产构建
        run: npm run check

      - name: 自动提交更新后的 demos/ 同级 *.out.txt
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(auto): update Linux shell *.out.txt files [skip ci]"
          file_pattern: "demos/**/*.out.txt"
