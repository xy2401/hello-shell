name: collect-docker-outputs

on:
  workflow_dispatch:

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行 Linux Shell 容器化输出采集
        run: npm run collect:docker

      - name: 验证项目与 VitePress 生产构建
        run: npm run check

      - name: 上传待审查的 Linux Docker 证据
        uses: actions/upload-artifact@v4
        with:
          name: hello-shell-linux-docker-evidence-${{ github.run_id }}
          path: |
            .env.versions
            demos/**/docker/*.out.txt
          include-hidden-files: true
          if-no-files-found: error

  collect-windows-native:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 采集 cmd、Windows PowerShell 5 与 PowerShell 7
        run: pwsh -NoProfile -File scripts/collect-windows.ps1
      - name: 上传待审查的 Windows 原生证据
        uses: actions/upload-artifact@v4
        with:
          name: hello-shell-windows-native-evidence-${{ github.run_id }}
          path: |
            demos/cmd/docker/*.out.txt
            demos/powershell/docker/native.*.out.txt
          if-no-files-found: error
