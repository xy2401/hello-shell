name: collect-docker-outputs

on:
  workflow_dispatch:

concurrency:
  group: shell-evidence-main
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行 Linux Shell 容器化输出采集
        run: npm run collect:docker

      - name: 验证项目与 VitePress 生产构建
        run: npm run check

      - name: 提交 Linux Docker 证据到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .env.versions ':(glob)demos/**/docker/*.out.txt'
          if git diff --cached --quiet; then
            echo "Linux Docker evidence is unchanged."
            exit 0
          fi
          git commit -m "chore: update Linux Docker evidence (run $GITHUB_RUN_ID)"
          git push origin HEAD:main

      - name: 上传 Linux Docker 证据备份
        uses: actions/upload-artifact@v4
        with:
          name: hello-shell-linux-docker-evidence-${{ github.run_id }}
          path: |
            .env.versions
            demos/**/docker/*.out.txt
          include-hidden-files: true
          if-no-files-found: error

  collect-windows-native:
    needs: collect-and-build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 采集 cmd、Windows PowerShell 5 与 PowerShell 7
        run: pwsh -NoProfile -File scripts/collect-windows.ps1
      - name: 提交 Windows 原生证据到 main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ":(glob)demos/cmd/docker/*.out.txt" ":(glob)demos/powershell/docker/native.*.out.txt"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Windows native evidence is unchanged."
            exit 0
          }
          git commit -m "chore: update Windows shell evidence (run $env:GITHUB_RUN_ID)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 上传 Windows 原生证据备份
        uses: actions/upload-artifact@v4
        with:
          name: hello-shell-windows-native-evidence-${{ github.run_id }}
          path: |
            demos/cmd/docker/*.out.txt
            demos/powershell/docker/native.*.out.txt
          if-no-files-found: error
